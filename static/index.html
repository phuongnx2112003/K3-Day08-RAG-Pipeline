<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookMind AI — Trợ Lý Review & Tóm Tắt Sách Chuyên Sâu</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Inter & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#06b6d4',
              600: '#0284c7',
              700: '#0369a1',
              accent: '#8b5cf6',
              glow: '#ec4899'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(236, 72, 153, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }
    
    .glass-card {
      background: rgba(17, 24, 39, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 12px 40px -10px rgba(6, 182, 212, 0.25);
    }

    .neon-text {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glow-box {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.5);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Sample Suggestions
    const SAMPLE_QUERIES = [
      "Phương pháp 4 bước để xây dựng thói quen tốt theo cuốn sách Atomic Habits là gì?",
      "Tác giả phân tích khái niệm 'Hệ thống 1' và 'Hệ thống 2' trong Thinking, Fast and Slow như thế nào?",
      "Vòng lặp Xây dựng - Đo lường - Học hỏi trong The Lean Startup hoạt động ra sao?",
      "Làm thế nào để làm việc sâu (Deep Work) trong một thế giới đầy xao nhãng?"
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('chat'); // chat | compare | library | sandbox | arch
      const [stats, setStats] = useState(null);
      const [books, setBooks] = useState([]);

      // Fetch health and books on load
      useEffect(() => {
        fetch('/api/health')
          .then(res => res.json())
          .then(data => setStats(data))
          .catch(err => console.error(err));

        fetch('/api/books')
          .then(res => res.json())
          .then(data => setBooks(data.books || []))
          .catch(err => console.error(err));
      }, []);

      // Trigger Lucide icons rendering
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div class="flex-1 flex flex-col min-h-screen">
          {/* HEADER / NAVIGATION BAR */}
          <header class="sticky top-0 z-50 glass-card border-b border-slate-800/80 px-4 py-3">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              
              {/* Logo & Title */}
              <div class="flex items-center space-x-3">
                <div class="relative group">
                  <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 to-purple-600 rounded-2xl blur opacity-75 group-hover:opacity-100 transition duration-300"></div>
                  <img src="/static/logo.jpg" alt="Logo" class="relative w-11 h-11 rounded-xl object-cover border border-white/20" />
                </div>
                <div>
                  <h1 class="text-xl font-extrabold tracking-tight neon-text flex items-center gap-2">
                    BookMind AI
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">RAG v2.0</span>
                  </h1>
                  <p class="text-xs text-slate-400">Trợ Lý Review & Tóm Tắt Sách Chuyên Sâu</p>
                </div>
              </div>

              {/* 5 INDEPENDENT NAVIGATION TABS */}
              <nav class="flex items-center bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800/80 shadow-inner overflow-x-auto max-w-full">
                <button
                  onClick={() => setActiveTab('chat')}
                  class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeTab === 'chat'
                      ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white shadow-lg shadow-cyan-500/25'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i data-lucide="message-square-quote" class="w-4 h-4"></i>
                  <span>AI Chat & Citation</span>
                </button>

                <button
                  onClick={() => setActiveTab('compare')}
                  class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeTab === 'compare'
                      ? 'bg-gradient-to-r from-purple-500 to-pink-600 text-white shadow-lg shadow-purple-500/25'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i data-lucide="git-compare" class="w-4 h-4"></i>
                  <span class="relative flex items-center gap-1.5">
                    So Sánh A/B
                    <span class="w-2 h-2 rounded-full bg-pink-400 animate-ping"></span>
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('library')}
                  class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeTab === 'library'
                      ? 'bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-blue-500/25'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i data-lucide="book-open" class="w-4 h-4"></i>
                  <span>Thư Viện Sách ({books.length})</span>
                </button>

                <button
                  onClick={() => setActiveTab('sandbox')}
                  class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeTab === 'sandbox'
                      ? 'bg-gradient-to-r from-teal-500 to-emerald-600 text-white shadow-lg shadow-teal-500/25'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i data-lucide="binary" class="w-4 h-4"></i>
                  <span>Vector Sandbox</span>
                </button>

                <button
                  onClick={() => setActiveTab('arch')}
                  class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeTab === 'arch'
                      ? 'bg-gradient-to-r from-amber-500 to-orange-600 text-white shadow-lg shadow-amber-500/25'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <i data-lucide="cpu" class="w-4 h-4"></i>
                  <span>Kiến Trúc RAG</span>
                </button>
              </nav>

            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">
            {activeTab === 'chat' && <ChatTab books={books} />}
            {activeTab === 'compare' && <CompareTab />}
            {activeTab === 'library' && <LibraryTab books={books} />}
            {activeTab === 'sandbox' && <SandboxTab />}
            {activeTab === 'arch' && <ArchitectureTab stats={stats} />}
          </main>

          {/* FOOTER */}
          <footer class="border-t border-slate-800/60 py-4 px-6 text-center text-xs text-slate-500 glass-card mt-auto">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-2">
              <p>© 2026 BookMind AI — Powered by Jina Embeddings v3 & ChromaDB Vector Store</p>
              <div class="flex items-center space-x-4">
                <span class="text-cyan-400">Task 4 & 5 Complete ✓</span>
                <span>•</span>
                <span class="text-purple-400">Role 3 (Hải Nguyễn)</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // =========================================================================
    // TAB 1: CHAT & CITATION
    // =========================================================================
    function ChatTab({ books }) {
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          content: 'Xin chào! Tôi là BookMind AI, trợ lý phân tích và tóm tắt sách chuyên sâu. Bạn muốn tìm hiểu bài học hay ý tưởng cốt lõi từ cuốn sách nào hôm nay?',
          sources: []
        }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [topK, setTopK] = useState(5);
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const handleSend = async (queryText) => {
        const text = queryText || input;
        if (!text.trim() || loading) return;

        const newMsgs = [...messages, { role: 'user', content: text }];
        setMessages(newMsgs);
        setInput('');
        setLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: text, top_k: topK })
          });
          const data = await res.json();
          setMessages([...newMsgs, {
            role: 'assistant',
            content: data.answer,
            sources: data.sources || [],
            latency: data.latency_sec
          }]);
        } catch (err) {
          setMessages([...newMsgs, {
            role: 'assistant',
            content: '❌ Lỗi kết nối server: ' + err.message,
            sources: []
          }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="flex-1 flex flex-col md:flex-row gap-6">
          {/* Main Chat Box */}
          <div class="flex-1 flex flex-col glass-card rounded-3xl overflow-hidden border border-slate-800/80">
            {/* Chat Messages List */}
            <div class="flex-1 p-4 md:p-6 overflow-y-auto space-y-6 max-h-[600px]">
              {messages.map((msg, idx) => (
                <div key={idx} class={`flex flex-col ${msg.role === 'user' ? 'items-end' : 'items-start'}`}>
                  <div class="flex items-center space-x-2 mb-1.5 text-xs text-slate-400">
                    <span>{msg.role === 'user' ? 'Bạn' : 'BookMind AI'}</span>
                    {msg.latency && <span class="bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-full">{msg.latency}s</span>}
                  </div>
                  
                  <div class={`max-w-[88%] p-4 rounded-2xl leading-relaxed text-sm md:text-base ${
                    msg.role === 'user'
                      ? 'bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-br-none shadow-md shadow-cyan-500/20'
                      : 'bg-slate-900/90 text-slate-100 rounded-bl-none border border-slate-800/80 shadow-lg'
                  }`}>
                    <div class="whitespace-pre-wrap">{msg.content}</div>

                    {/* Sources Collapsible */}
                    {msg.sources && msg.sources.length > 0 && (
                      <div class="mt-4 pt-3 border-t border-slate-800">
                        <details class="group">
                          <summary class="cursor-pointer text-xs font-semibold text-cyan-400 hover:text-cyan-300 flex items-center gap-1">
                            <i data-lucide="book-marked" class="w-3.5 h-3.5"></i>
                            <span>Nguồn trích dẫn ({msg.sources.length} chunks)</span>
                          </summary>
                          <div class="mt-3 space-y-2">
                            {msg.sources.map((src, i) => (
                              <div key={i} class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800/80 text-xs">
                                <div class="flex items-center justify-between text-slate-400 font-semibold mb-1">
                                  <span class="text-cyan-300">[{i+1}] {src.metadata?.source}</span>
                                  <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">Score: {src.score}</span>
                                </div>
                                <p class="text-slate-300 italic line-clamp-3">"{src.content}"</p>
                              </div>
                            ))}
                          </div>
                        </details>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {loading && (
                <div class="flex items-center space-x-3 p-4 glass-card rounded-2xl max-w-xs animate-pulse">
                  <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></div>
                  <span class="text-xs text-cyan-300 font-semibold">Đang tìm kiếm chunks và tổng hợp...</span>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            {/* Input Box */}
            <div class="p-4 bg-slate-950/80 border-t border-slate-800">
              <div class="flex items-center space-x-2">
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="Nhập câu hỏi về thói quen, tư duy, kinh doanh..."
                  class="flex-1 bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
                <button
                  onClick={() => handleSend()}
                  disabled={loading}
                  class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold p-3.5 rounded-2xl shadow-lg shadow-cyan-500/25 transition disabled:opacity-50"
                >
                  <i data-lucide="send" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>

          {/* Sidebar Suggestions & Controls */}
          <div class="w-full md:w-80 flex flex-col space-y-4">
            <div class="glass-card p-5 rounded-3xl border border-slate-800/80">
              <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-cyan-400"></i>
                Câu Hỏi Gợi Ý
              </h3>
              <div class="space-y-2">
                {SAMPLE_QUERIES.map((q, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSend(q)}
                    class="w-full text-left p-3 rounded-2xl bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800/60 text-xs text-slate-300 hover:text-cyan-300 transition duration-200"
                  >
                    "{q}"
                  </button>
                ))}
              </div>
            </div>

            <div class="glass-card p-5 rounded-3xl border border-slate-800/80">
              <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-2">
                <i data-lucide="sliders" class="w-4 h-4 text-purple-400"></i>
                Cấu Hình Retrieval
              </h3>
              <div>
                <label class="text-xs text-slate-400 flex justify-between mb-2">
                  <span>Số lượng Chunks (top_k)</span>
                  <span class="font-bold text-cyan-400">{topK}</span>
                </label>
                <input
                  type="range"
                  min="2"
                  max="10"
                  value={topK}
                  onChange={(e) => setTopK(parseInt(e.target.value))}
                  class="w-full accent-cyan-500"
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 2: A/B COMPARISON (BEFORE VS AFTER RAG)
    // =========================================================================
    function CompareTab() {
      const [query, setQuery] = useState(SAMPLE_QUERIES[0]);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const handleCompare = async (qText) => {
        const text = qText || query;
        if (!text.trim() || loading) return;

        setLoading(true);
        try {
          const res = await fetch('/api/compare', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: text, top_k: 5 })
          });
          const data = await res.json();
          setResult(data);
        } catch (err) {
          alert('Lỗi so sánh: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="space-y-6">
          {/* Header Banner */}
          <div class="glass-card p-6 rounded-3xl border border-purple-500/20 bg-gradient-to-r from-purple-900/20 via-slate-900 to-cyan-900/20">
            <h2 class="text-xl font-extrabold text-white flex items-center gap-2 mb-2">
              <i data-lucide="scale" class="w-6 h-6 text-purple-400"></i>
              So Sánh Trực Quan: Trước vs Sau khi áp dụng RAG
            </h2>
            <p class="text-xs md:text-sm text-slate-300">
              Kiểm chứng sự khác biệt vượt trội về độ chính xác, trích dẫn nguồn thực tế và khả năng chống ảo giác (hallucination) giữa LLM thuần túy và RAG Pipeline.
            </p>

            <div class="mt-4 flex flex-col md:flex-row gap-3">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Nhập câu hỏi để so sánh..."
                class="flex-1 bg-slate-950/90 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-purple-500"
              />
              <button
                onClick={() => handleCompare()}
                disabled={loading}
                class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold px-6 py-3 rounded-2xl shadow-lg shadow-purple-500/25 transition flex items-center justify-center gap-2 whitespace-nowrap"
              >
                {loading ? <span class="animate-spin">⏳</span> : <i data-lucide="play" class="w-4 h-4"></i>}
                <span>Chạy So Sánh A/B</span>
              </button>
            </div>
          </div>

          {/* Comparison Panels */}
          {result && (
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* BEFORE RAG */}
              <div class="glass-card p-6 rounded-3xl border border-red-500/30 bg-red-950/10">
                <div class="flex items-center justify-between pb-4 border-b border-red-500/20 mb-4">
                  <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-red-500"></span>
                    <h3 class="font-bold text-red-400 text-base">{result.before_rag.title}</h3>
                  </div>
                  <span class="text-xs bg-red-500/20 text-red-300 px-2.5 py-1 rounded-full font-semibold">LLM Thuần Túy</span>
                </div>

                <div class="space-y-4">
                  <div class="p-4 rounded-2xl bg-slate-950/80 border border-slate-800/80 text-xs md:text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">
                    {result.before_rag.answer}
                  </div>

                  <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span class="text-slate-400 block">Trích Dẫn Nguồn:</span>
                      <span class="font-bold text-red-400">❌ Không có (0 chunks)</span>
                    </div>
                    <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span class="text-slate-400 block">Rủi Ro Ảo Giác:</span>
                      <span class="font-bold text-red-400">⚠️ {result.before_rag.hallucination_risk}</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* AFTER RAG */}
              <div class="glass-card p-6 rounded-3xl border border-cyan-500/40 bg-cyan-950/10">
                <div class="flex items-center justify-between pb-4 border-b border-cyan-500/20 mb-4">
                  <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                    <h3 class="font-bold text-cyan-300 text-base">{result.after_rag.title}</h3>
                  </div>
                  <span class="text-xs bg-cyan-500/20 text-cyan-300 px-2.5 py-1 rounded-full font-semibold">Jina + ChromaDB + RAG</span>
                </div>

                <div class="space-y-4">
                  <div class="p-4 rounded-2xl bg-slate-950/80 border border-slate-800/80 text-xs md:text-sm text-slate-200 leading-relaxed whitespace-pre-wrap">
                    {result.after_rag.answer}
                  </div>

                  <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span class="text-slate-400 block">Trích Dẫn Nguồn:</span>
                      <span class="font-bold text-emerald-400">✓ Có [{result.after_rag.retrieved_chunks} Chunks]</span>
                    </div>
                    <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                      <span class="text-slate-400 block">Rủi Ro Ảo Giác:</span>
                      <span class="font-bold text-emerald-400">🛡️ {result.after_rag.hallucination_risk}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // TAB 3: KNOWLEDGE LIBRARY
    // =========================================================================
    function LibraryTab({ books }) {
      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-white flex items-center gap-2">
                <i data-lucide="library" class="w-5 h-5 text-blue-400"></i>
                Kho Tri Thức Sách Đã Chuẩn Hóa
              </h2>
              <p class="text-xs text-slate-400">Tất cả tài liệu phân tích & tóm tắt sách đã index vào ChromaDB</p>
            </div>
            <span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1 rounded-full text-xs font-semibold">
              {books.length} Tác Phẩm
            </span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            {books.map((book, idx) => (
              <div key={idx} class="glass-card glass-card-hover p-6 rounded-3xl border border-slate-800/80 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between text-xs mb-3">
                    <span class="bg-cyan-500/10 text-cyan-400 px-2.5 py-1 rounded-full font-semibold border border-cyan-500/20">
                      {book.category}
                    </span>
                    <span class="text-slate-500">{book.size_kb} KB</span>
                  </div>

                  <h3 class="text-base font-bold text-slate-100 mb-1 leading-snug">{book.title}</h3>
                  <p class="text-xs text-slate-400 mb-4">Tác giả: <span class="text-slate-200 font-medium">{book.author}</span></p>
                </div>

                <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                  <span class="flex items-center gap-1">
                    <i data-lucide="file-text" class="w-3.5 h-3.5 text-slate-500"></i>
                    {book.filename}
                  </span>
                  <span class="text-emerald-400 font-semibold">Ready ✓</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 4: VECTOR SANDBOX
    // =========================================================================
    function SandboxTab() {
      const [query, setQuery] = useState('atomic habits 4 steps');
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);

      const handleSearch = async () => {
        if (!query.trim()) return;
        setLoading(true);
        try {
          const res = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, top_k: 6 })
          });
          const data = await res.json();
          setResults(data.results || []);
        } catch (e) {
          alert(e.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="space-y-6">
          <div class="glass-card p-6 rounded-3xl border border-teal-500/20">
            <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
              <i data-lucide="search" class="w-5 h-5 text-teal-400"></i>
              Semantic Search Inspector (Jina Embeddings v3)
            </h2>
            <p class="text-xs text-slate-400 mb-4">Soi trực tiếp các chunk vector tương đồng nhất trong ChromaDB kèm Cosine Score</p>

            <div class="flex gap-3">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Nhập truy vấn vector..."
                class="flex-1 bg-slate-950/90 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-teal-500"
              />
              <button
                onClick={handleSearch}
                disabled={loading}
                class="bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-400 hover:to-emerald-500 text-white font-bold px-6 py-3 rounded-2xl transition"
              >
                Inspect Vector Chunks
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {results.map((r, i) => (
              <div key={i} class="glass-card p-5 rounded-3xl border border-slate-800 space-y-3">
                <div class="flex items-center justify-between text-xs border-b border-slate-800 pb-2">
                  <span class="font-bold text-cyan-400">[{i+1}] {r.metadata?.source}</span>
                  <span class="bg-teal-500/20 text-teal-300 px-2.5 py-0.5 rounded-full font-bold">
                    Score: {r.score}
                  </span>
                </div>
                <p class="text-xs text-slate-300 leading-relaxed">{r.content}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // TAB 5: ARCHITECTURE
    // =========================================================================
    function ArchitectureTab({ stats }) {
      return (
        <div class="space-y-6">
          <div class="glass-card p-6 rounded-3xl border border-amber-500/20">
            <h2 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
              <i data-lucide="cpu" class="w-5 h-5 text-amber-400"></i>
              Kiến Trúc RAG Pipeline (Role 3 Executed)
            </h2>
            <p class="text-xs text-slate-400">Mô hình hoạt động End-to-End từ Markdown -> Chunking -> Jina API -> ChromaDB -> Semantic Search</p>

            <div class="mt-6 grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
                <div class="text-2xl font-extrabold text-cyan-400">9</div>
                <div class="text-xs text-slate-400">Tài Liệu Markdown</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
                <div class="text-2xl font-extrabold text-purple-400">229</div>
                <div class="text-xs text-slate-400">Chunks Index</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
                <div class="text-2xl font-extrabold text-pink-400">1024-dim</div>
                <div class="text-xs text-slate-400">Jina Embeddings v3</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">
                <div class="text-2xl font-extrabold text-emerald-400">ChromaDB</div>
                <div class="text-xs text-slate-400">Vector Store Local</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
